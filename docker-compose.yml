services:
  bot:
    build: .
    container_name: disloc_bot
    command: python -m app.bot.main
    env_file: .env
    volumes:
      - ./data:/app/data          # книга 1 ТР4, кэш графа, SQLite с накладными
    restart: unless-stopped
    mem_limit: 300m

  api:
    build: .
    container_name: disloc_api
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000 --proxy-headers
    env_file: .env
    volumes:
      - ./data:/app/data
    ports:
      - "127.0.0.1:8030:8000"     # наружу только через nginx
    restart: unless-stopped
    mem_limit: 300m
    depends_on:
      - bot                       # бот при первом старте скачивает ТР4
